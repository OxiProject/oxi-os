#
# Oxi OS Bootloader (GRUB via EFI) Configuration
#
# Keys here MUST match bootloader/main.py + bootloader.schema.yaml:
# efiBootLoader, kernelSearchPath, kernelPattern, kernelParams,
# grubInstall, grubMkconfig, grubCfg, grubProbe, efiBootMgr,
# efiBootloaderId, installEFIFallback.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet", "splash" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "OxiOS"
installEFIFallback: true
