#
# Oxi OS GRUB Defaults (grubcfg module) Configuration
#
# Keys here MUST match grubcfg.schema.yaml:
# overwrite, keep_distributor, prefer_grub_d, kernel_params, defaults, always_use_defaults.
# Theme + quiet splash are written to /etc/default/grub.d/99-oxios.cfg
# in the target so /etc/default/grub itself stays distro-clean.
---
overwrite: false
keep_distributor: false
prefer_grub_d: true
kernel_params: [ "quiet", "splash" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
