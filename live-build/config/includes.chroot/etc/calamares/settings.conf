---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id: rootfs
    module: unpackfs
    config: unpackfs.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs@rootfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: oxios
prompt-install: false
dont-chroot: false
oem-setup: false
